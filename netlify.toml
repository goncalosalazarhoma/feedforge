[build]
  publish = "public"
  command = "echo 'no build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["papaparse"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"

# always revalidate the UI so a new deploy is picked up immediately
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Page Builder static pages (pretty URLs)
[[redirects]]
  from = "/page-builder/blocks"
  to = "/page-builder/blocks.html"
  status = 200

[[redirects]]
  from = "/page-builder/capability-test"
  to = "/page-builder/capability-test.html"
  status = 200
